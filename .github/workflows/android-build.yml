name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Configure Android SDK tools
        run: |
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          test -x "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

      - name: Verify Android toolchain
        run: |
          sdkmanager --version
          sdkmanager --list_installed | grep -E 'platforms;android-37|build-tools;36.0.0|cmake;3.31.5|ndk;28.2.13676358' || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mesh-medic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
